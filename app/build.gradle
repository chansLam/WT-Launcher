apply plugin: "com.android.application"

android {
    namespace "com.android.launcherWT"
    compileSdk 34

    defaultConfig {
        applicationId "com.android.launcherWT"
        minSdk 19
        targetSdk 19
        versionCode 10817230
        versionName "1.8.17.23.release"
    }

    // The car build keeps targetSdk 19; Android 13/14 emulators refuse to
    // install anything under 23, so the avd flavor raises it and takes a
    // separate applicationId so both can live on one device.
    flavorDimensions "channel"

    productFlavors {
        car {
            dimension "channel"
            targetSdk 19
            // 车机 i.MX6Q 只有 32 位 ARM，带上 conscrypt 的其它 ABI 只会白白撑大包
            ndk { abiFilters "armeabi-v7a" }
        }
        avd {
            dimension "channel"
            applicationIdSuffix ".avd"
            versionNameSuffix "-avd"
            targetSdk 33
            ndk { abiFilters "x86" }
        }
    }

    // i.MX6Q 车机平台证书（freescale platform，与本机系统应用同签名）
    // 私钥不入库：放在仓库根 .signing/platform.jks（已被 *.jks 忽略）
    signingConfigs {
        platform {
            storeFile rootProject.file(".signing/platform.jks")
            storePassword "android"
            keyAlias "platform"
            keyPassword "android"
            enableV1Signing true
            enableV2Signing true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.platform
        }
        debug {
            // AVD/调试仍用默认 debug 签名，避免与已装 .avd 包签名冲突
        }
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(":core")
    implementation "com.android.support:appcompat-v7:27.1.1"
    implementation "com.android.support:recyclerview-v7:27.1.1"
    implementation "com.android.support.constraint:constraint-layout:1.1.3"
    implementation "com.google.code.gson:gson:2.8.6"
    // 车机（API19）上壁纸站点普遍连不通：系统 SSL 是 2010 年的 OpenSSL，根证书停在 2013 年。
    // okhttp 3.12 是最后一条兼容 API19 的线，conscrypt 2.5.2 提供 BoringSSL 的 TLS1.2。
    implementation "com.squareup.okhttp3:okhttp:3.12.13"
    implementation "org.conscrypt:conscrypt-android:2.5.2"
    compileOnly project(":platform-stubs")
}
